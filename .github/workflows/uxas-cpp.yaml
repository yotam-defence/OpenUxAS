on:
    push:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
            - 'tests/diff/**'
    pull_request:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
            - 'tests/diff/**'
    workflow_dispatch:
    schedule:
        - cron: '20 3 * * 4'

name: Build and Test UxAS C++
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                env: [
                    {os: ubuntu-22.04, python: '3.10'},
                    {os: ubuntu-24.04, python: '3.12'}
                ]
                compiler: [gcc, clang]
                component: [uxas]
                qualifier: [scenario=release, scenario=gcov]
        runs-on: ${{ matrix.env.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  path: OpenUxAS

            - name: Set up python ${{ matrix.env.python }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.env.python }}

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                  java-version: '11'
                  distribution: 'adopt'

            - name: Install infrastructure
              run: |
                  cd OpenUxAS
                  infrastructure/install -vv --no-gnat --no-java -y

            - name: Install GoogleTest and compiler
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtest-dev ${{ matrix.compiler == 'clang' && 'clang' || 'g++' }}

            - name: Build OpenUxAS C++
              env:
                  CXX_COMPILER: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
              run: |
                  cd OpenUxAS
                  ./anod -v build ${{ matrix.component }} --qualifier=${{ matrix.qualifier}}

            - name: Install python packages for tests/diff (pylmcp)
              run: python3 -m pip install e3-core pyzmq

            - name: Unit tests (GoogleTest, diff unit tests, diff smoke via make test)
              env:
                  CXX_COMPILER: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
              run: |
                  cd OpenUxAS
                  ./anod -v test ${{ matrix.component }} --qualifier=${{ matrix.qualifier}}

            - name: Differential harness unit tests
              run: |
                  cd OpenUxAS/tests/diff
                  python3 -m unittest discover -s tests

            - name: Differential smoke run (golden)
              env:
                  PYTHONPATH: ${{ github.workspace }}/OpenUxAS/tests/cpp
              run: |
                  # anod builds into its own build space; locate the binary
                  UXAS_BIN=$(find "$GITHUB_WORKSPACE" -type f -name uxas -perm -u+x -not -path '*/src/*' -not -path '*/examples/*' | head -1)
                  test -n "$UXAS_BIN" || { echo "uxas binary not found"; exit 1; }
                  export UXAS_BIN
                  cd OpenUxAS/tests/diff
                  python3 -m uxas_diff run smoke_heartbeat --golden

            - name: Test OpenUxAS C++
              run: |
                  cd OpenUxAS/tests/cpp
                  ./run-tests --qualifier=${{ matrix.qualifier}}
