on:
    push:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    pull_request:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    workflow_dispatch:
    schedule:
        - cron: '20 3 * * 4'

name: Build and Test UxAS C++
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                env: [
                    {os: ubuntu-22.04, python: '3.10'},
                    {os: ubuntu-24.04, python: '3.12'}
                ]
                compiler: [gcc, clang]
                component: [uxas]
                qualifier: [scenario=release, scenario=gcov]
        runs-on: ${{ matrix.env.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  path: OpenUxAS

            - name: Set up python ${{ matrix.env.python }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.env.python }}

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                  java-version: '11'
                  distribution: 'adopt'

            - name: Install C++17 toolchain and GoogleTest
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtest-dev
                  if [ "${{ matrix.compiler }}" = "clang" ]; then
                      sudo apt-get install -y clang-14
                      echo "UXAS_CXX=clang++-14" >> "$GITHUB_ENV"
                  else
                      # GCC >= 11 is required for C++17
                      sudo apt-get install -y g++-11
                      echo "UXAS_CXX=g++-11" >> "$GITHUB_ENV"
                  fi

            - name: Install infrastructure
              run: |
                  cd OpenUxAS
                  infrastructure/install -vv --no-gnat --no-java -y

            - name: Build OpenUxAS C++
              run: |
                  cd OpenUxAS
                  ./anod -v build ${{ matrix.component }} --qualifier=${{ matrix.qualifier}}

            - name: Install pyzmq for the differential harness
              run: python3 -m pip install pyzmq pytest

            - name: Run C++ unit tests and differential smoke run (make test)
              run: |
                  cd OpenUxAS
                  # The Makefile picks up the anod build environment itself.
                  # `make test` = GoogleTest suite + `make test-differential`:
                  # compares against uxas_ada ($UXAS_ADA_BIN or PATH) if present,
                  # else the committed golden, else C++-only (parity NOT checked,
                  # clearly reported in the log).
                  make test CXX_COMPILER="$UXAS_CXX"

            - name: Differential harness self-test
              run: |
                  cd OpenUxAS
                  python3 -I tests/cpp/differential/run_differential.py --self-test

            - name: Test OpenUxAS C++
              run: |
                  cd OpenUxAS/tests/cpp
                  ./run-tests --qualifier=${{ matrix.qualifier}}
