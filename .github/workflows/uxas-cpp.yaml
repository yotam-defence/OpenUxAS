on:
    push:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    pull_request:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    workflow_dispatch:
    schedule:
        - cron: '20 3 * * 4'

name: Build and Test UxAS C++
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                env: [
                    {os: ubuntu-22.04, python: '3.10'},
                    {os: ubuntu-24.04, python: '3.12'}
                ]
                compiler: [gcc, clang]
                component: [uxas]
                qualifier: [scenario=release, scenario=gcov]
        runs-on: ${{ matrix.env.os }}
        env:
            CC: ${{ matrix.compiler }}
            CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        steps:
            - uses: actions/checkout@v4
              with:
                  path: OpenUxAS

            - name: Set up python ${{ matrix.env.python }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.env.python }}

            - name: Install compiler and unit test dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y g++ clang libgtest-dev
                  # Ubuntu ships gtest as sources only on some releases
                  if [ ! -f /usr/lib/x86_64-linux-gnu/libgtest.a ]; then
                      (cd /usr/src/googletest && sudo cmake . && sudo make install)
                  fi

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                  java-version: '11'
                  distribution: 'adopt'

            - name: Install infrastructure
              run: |
                  cd OpenUxAS
                  infrastructure/install -vv --no-gnat --no-java -y

            - name: Build OpenUxAS C++
              run: |
                  cd OpenUxAS
                  ./anod -v build ${{ matrix.component }} --qualifier=${{ matrix.qualifier}}

            - name: Test OpenUxAS C++
              run: |
                  cd OpenUxAS/tests/cpp
                  ./run-tests --qualifier=${{ matrix.qualifier}}

            - name: Run C++ unit tests (make test)
              run: |
                  cd OpenUxAS
                  make test CXX="$CXX"
