on:
    push:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    pull_request:
        paths:
            - 'infrastructure/uxas/**'
            - 'infrastructure/paths.sh'
            - 'infrastructure/specs/**'
            - 'infrastructure/install-libexec/**'
            - 'anod'
            - 'src/cpp/**'
            - 'tests/cpp/**'
    workflow_dispatch:
    schedule:
        - cron: '20 3 * * 4'

name: Build and Test UxAS C++
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                env: [
                    {os: ubuntu-22.04, python: '3.10'},
                    {os: ubuntu-24.04, python: '3.12'}
                ]
                # Toolchain notes: supported compilers are GCC 11+ (22.04 ships
                # 11, 24.04 ships 13) and Clang 14+ (22.04: 14, 24.04: 18),
                # all of which support -std=c++17. Anod builds always use g++;
                # the clang entry only builds and runs the unit tests.
                component: [uxas]
                qualifier: [scenario=release, scenario=gcov]
        runs-on: ${{ matrix.env.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  path: OpenUxAS

            - name: Set up python ${{ matrix.env.python }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.env.python }}

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                  java-version: '11'
                  distribution: 'adopt'

            - name: Install GoogleTest
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtest-dev

            - name: Install infrastructure
              run: |
                  cd OpenUxAS
                  infrastructure/install -vv --no-gnat --no-java -y

            - name: Build OpenUxAS C++
              run: |
                  cd OpenUxAS
                  ./anod -v build ${{ matrix.component }} --qualifier=${{ matrix.qualifier}}

            - name: Run GoogleTest suite (GCC)
              run: |
                  cd OpenUxAS
                  ./anod -v test ${{ matrix.component }} --qualifier=${{ matrix.qualifier}}

            - name: Test OpenUxAS C++
              run: |
                  cd OpenUxAS/tests/cpp
                  ./run-tests --qualifier=${{ matrix.qualifier}}

    unit-tests-compilers:
        # Run the GoogleTest suite with both GCC and Clang (C++17 baseline)
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-22.04, ubuntu-24.04]
                cxx: [g++, clang++]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  path: OpenUxAS

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.os == 'ubuntu-22.04' && '3.10' || '3.12' }}

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                  java-version: '11'
                  distribution: 'adopt'

            - name: Install GoogleTest and compilers
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtest-dev clang

            - name: Install infrastructure
              run: |
                  cd OpenUxAS
                  infrastructure/install -vv --no-gnat --no-java -y

            - name: Run GoogleTest suite (${{ matrix.cxx }})
              run: |
                  cd OpenUxAS
                  ./anod -v test uxas --qualifier=cxx=${{ matrix.cxx }}
