# Build OpenUxAS C++ with -std=c++17 using both gcc and clang and run the
# GoogleTest unit tests (make test). Dependencies are built by anod; GoogleTest
# comes from the system package libgtest-dev (installed by the infrastructure
# install script).
on:
    push:
        paths:
            - 'Makefile'
            - 'src/cpp/**'
            - 'tests/cpp/unit/**'
            - 'infrastructure/**'
            - '.github/workflows/cpp17.yml'
    pull_request:
        paths:
            - 'Makefile'
            - 'src/cpp/**'
            - 'tests/cpp/unit/**'
            - 'infrastructure/**'
            - '.github/workflows/cpp17.yml'
    workflow_dispatch:

name: C++17 build (gcc and clang) and unit tests
jobs:
    cpp17:
        strategy:
            fail-fast: false
            matrix:
                env: [
                    {os: ubuntu-22.04, python: '3.10', clang: '14'},
                    {os: ubuntu-24.04, python: '3.12', clang: '18'}
                ]
                compiler: [gcc, clang]
        runs-on: ${{ matrix.env.os }}
        steps:
            - uses: actions/checkout@v4
              with:
                  path: OpenUxAS

            - name: Set up python ${{ matrix.env.python }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.env.python }}

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                  java-version: '11'
                  distribution: 'adopt'

            - name: Install compilers
              run: |
                  sudo apt-get update
                  sudo apt-get install -y g++ libgtest-dev clang-${{ matrix.env.clang }}

            - name: Install infrastructure
              run: |
                  cd OpenUxAS
                  infrastructure/install -vv --no-gnat --no-java -y

            # Builds all dependencies (and uxas itself) with gcc through anod
            - name: Build with gcc and run unit tests
              if: matrix.compiler == 'gcc'
              run: |
                  cd OpenUxAS
                  ./anod -v build uxas
                  ./anod -v test uxas

            # Re-use the anod dependency environment but compile with clang
            - name: Build with clang and run unit tests
              if: matrix.compiler == 'clang'
              run: |
                  cd OpenUxAS
                  ./anod -v build uxas
                  ANODENV="$(./anod printenv uxas --build-env --inline)"
                  make OBJECT_DIR=obj/clang CXX="${ANODENV}clang++-${{ matrix.env.clang }}" all
                  make OBJECT_DIR=obj/clang CXX="${ANODENV}clang++-${{ matrix.env.clang }}" test
